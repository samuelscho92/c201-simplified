    "subtitle": "Course 201 · Chapter 1 · Holiness of God",
    "content": "# SESSION 1A — SEEING GOD\n**Course 201 · Chapter 1 · Holiness of God**\n\n---\n\n## Key Words\n\nBefore you begin, learn these words. You will see them many times in this session.\n\n| Word | Meaning |\n|---|---|\n| holy | completely pure; completely separate from all sin |\n| holiness | the quality of being holy |\n| glory | the great light, beauty, and power of God |\n| sin | choosing to do wrong against God |\n| eternal | lasting forever; with no end |\n| seraphim | powerful angels who stand before God |\n| attribute | a quality that describes who someone is |\n| transcendent | far above everything; in a completely different level |\n\n---\n\n## Opening Song: \"Alas, and Did My Savior Bleed\"\n\n> *[KEEP ORIGINAL HYMN TEXT — do not rewrite]*\n\n**What this song means:**\n\nThis is an old song about Jesus dying on the cross.\n\nThe writer asks: \"Did Jesus really die for me?\"\n\nHe is amazed that Jesus — who is holy — would die for sinful people.\n\nHe feels deep thankfulness. He wants to give his whole life to God.\n\n---\n\n## PART 1: GOD'S LONGING\n\nEvery person wants to be truly known.\n\nWe want others to see us as we really are.\n\nWhen someone has a wrong view of us, we cannot have a real friendship with them.\n\nThis is also true with God.\n\n**God's longing is this: he wants us to know him as he truly is.**\n\n---\n\n**Jeremiah 9:23–24 (NLT)**\n\n> This is what the LORD says: \"Don't let the wise boast in their wisdom, or the powerful boast in their power, or the rich boast in their riches. But those who wish to boast should boast in this alone: that they truly know me and understand that I am the LORD who demonstrates unfailing love and who brings justice and righteousness to the earth, and that I delight in these things. I, the LORD, have spoken!\"\n\n*Definition table (right sidebar):*\n\n| Word | Meaning |\n|---|---|\n| boast¹ | to talk proudly about yourself |\n| unfailing love² | love that never stops or changes |\n| justice³ | treating people fairly; punishing wrong |\n| righteousness⁴ | doing what is right and good |\n\n---\n\n**Isaiah 1:2–3 (NLT)**\n\n> Listen, O heavens! Pay attention, earth! This is what the LORD says: \"The children I raised and cared for have rebelled against me. Even an ox knows its owner, and a donkey recognizes its master's care — but Israel doesn't know its master. My people don't recognize my care for them.\"\n\n*Definition table (right sidebar):*\n\n| Word | Meaning |\n|---|---|\n| rebelled⁵ | refused to obey; turned against |\n\n---\n\n**John 17:3 (NLT)**\n\n> And this is the way to have eternal life — to know you, the only true God, and Jesus Christ, the one you sent to earth.\n\n---\n\n**Discussion Question:**\n\nAccording to these verses, what does God want from us?\n\n---\n\n## PART 2: THE MISSING PICTURE\n\nMany people have different ideas about God.\n\nBut one idea is often missing: **God is holy.**\n\nHoliness is very important. We must understand it to know who God really is.\n\nWithout understanding holiness, we will have a wrong view of God.\n\nWe may also find it hard to understand why Jesus had to die on the cross.\n\n---\n\n**Quote — R.C. Sproul, *Holiness of God*:**\n\n> \"The most important idea I found in the Bible is that God is holy. It is basic to understanding God and Christianity. The Bible says that God's name is holy — because he is holy.\"\n\n*(This is a simplified version of the original quote.)*\n\n---\n\n**Isaiah 6:1–8 (NLT)**\n\n> It was in the year King Uzziah died that I saw the Lord. He was sitting on a lofty throne, and the train of his robe filled the Temple. Attending him were mighty seraphim, each having six wings. With two wings they covered their faces, with two they covered their feet, and with two they flew. They were calling out to each other,\n>\n> *\"Holy, holy, holy is the LORD of Heaven's Armies! The whole earth is filled with his glory!\"*\n>\n> Their voices shook the Temple to its foundations, and the entire building was filled with smoke.\n>\n> Then I said, \"It's all over! I am doomed, for I am a sinful man. I have filthy lips, and I live among a people with filthy lips. Yet I have seen the King, the LORD of Heaven's Armies.\"\n>\n> Then one of the seraphim flew to me with a burning coal he had taken from the altar with a pair of tongs. He touched my lips with it and said, \"See, this coal has touched your lips. Now your guilt is removed, and your sins are forgiven.\"\n>\n> Then I heard the Lord asking, \"Whom should I send as a messenger to this people? Who will go for us?\"\n>\n> I said, \"Here I am. Send me.\"\n\n*Definition table (right sidebar):*\n\n| Word | Meaning |\n|---|---|\n| lofty⁶ | very high up |\n| seraphim⁷ | powerful angels (see Key Words) |\n| foundations⁸ | the bottom structure that holds up a building |\n| guilt⁹ | the feeling and fact of having done wrong |\n\n---\n\nThe Bible sometimes repeats something three times. This shows it is very, very important.\n\nIn Isaiah 6, the seraphim say God is \"holy, holy, holy.\"\n\nThis is the only quality of God repeated three times in the whole Bible.\n\nGod is not called \"love, love, love.\" Not \"powerful, powerful, powerful.\"\n\nOnly **holy** is said three times.\n\nThis shows holiness is the most important thing to know about God.\n\n---\n\n**Fill in the blank:**\n\nR.C. Sproul says there is only one quality of God that is ____________ in the Bible.\n\n---\n\n## PART 3: THE MEANING OF HOLINESS\n\nWhat does \"holy\" mean?\n\nMany people think it means \"pure\" — having no sin at all.\n\nThis is true. But it is not the main meaning.\n\n**The main meaning of \"holy\" is \"separate.\"**\n\nThe original word means \"to cut\" or \"to separate.\"\n\nThink of it this way: God is not just a little better than us. He is in a completely different category.\n\n---\n\nHere is a second meaning: God is also **transcendent**.\n\nTranscendent means \"far above everything else.\"\n\n*Example: A king sits high on a throne, above all the people. He is higher, more powerful, and different from everyone in the room. Now imagine someone infinitely higher than the greatest king. That is a small picture of God's transcendence.*\n\nGod is above the world. The world cannot control him. He has all power over the world.\n\n---\n\n**Quote — R.C. Sproul, *Holiness of God*:**\n\n> \"God is separate from us. He is above us. He is greater than all things. When the Bible calls God holy, it means he is different from us in a special way. He is far above everything.\"\n\n*(This is a simplified version of the original quote.)*\n\n---\n\n**Discussion Questions:**\n\n1. What is something new you learned about the meaning of holiness?\n2. What do you think or feel when you think of God as holy?\n3. How strong is your sense of God's holiness right now?\n4. Why is it important to understand that God is holy?\n\n---\n\n## SESSION 1A QUIZ\n\n**1. Fill in the blank:**\n\nTo have a real relationship, we must be ____________ as we are.\n\n---\n\n**2. Choose the best answer:**\n\nIn Isaiah 6, the seraphim said \"Holy, holy, holy is the Lord of Heaven's Armies.\" What does this mean?\n\n- a) The Father, Son, and Holy Spirit are each holy\n- b) Holiness is the most important quality of God\n- c) The seraphim's feet were not clean before God\n- d) This is the right way to come into God's presence\n\n---\n\n**3. Choose the best answer:**\n\nWhich word does **not** mean \"holy\"?\n\n- a) Pure\n- b) Separate\n- c) Transcendent\n- d) Just\n\n---\n\n*End of Session 1A*\n\n---\n\n**Layout Note (for document formatting):**\nDefinition tables marked \"right sidebar\" should be placed in the right 1/3 column of the page, aligned with their corresponding Bible verse or quote. Use matching superscript numbers (¹ ² ³...) to connect difficult words in the text to their definitions in the sidebar table.\n"
  },

    "subtitle": "Course 201 · Chapter 1 · Holiness of God",
    "content": "# SESSION 1B — SEEING MYSELF\n**Course 201 · Chapter 1 · Holiness of God**\n\n---\n\n## Key Words\n\n| Word | Meaning |\n|---|---|\n| sinner | a person who does wrong against God |\n| prophet | a person God chose to speak his words to people |\n| conviction | a strong feeling that something is true; here: knowing you have done wrong |\n| calibrate | to measure something by comparing it to a standard |\n| suppress | to stop something from being seen or known |\n| wrath | very strong anger; here: God's holy anger toward sin |\n\n---\n\n## Part 1: Seeing Myself — \"Woe Is Me!\"\n\nIn the last session, we read about Isaiah seeing God.\n\nWhen Isaiah saw God's holiness, he immediately saw himself clearly.\n\nHe saw that he was a sinner. He said: \"Woe is me! I am lost!\"\n\n**Quote — R.C. Sproul, *Holiness of God*:**\n\n> \"He saw the holiness of God. For the first time in his life Isaiah really understood who God was. At the same instant, for the first time Isaiah really understood who Isaiah was.\"\n\nThis is important: Isaiah did not praise God first.\n\nHe first felt deep sadness about his own sin.\n\nThis is true for everyone in the Bible who sees God's holiness.\n\n**Seeing God always leads to seeing ourselves — and our sin — more clearly.**\n\n---\n\nPeter had a very similar experience when he first met Jesus.\n\n**Luke 5:4–10 (NLT)**\n\n> When he had finished speaking, he said to Simon, \"Now go out where it is deeper, and let down your nets to catch some fish.\"\n>\n> \"Master,\" Simon replied, \"we worked hard all last night and didn't catch a thing. But if you say so, I'll let the nets down again.\" And this time their nets were so full of fish they began to tear! A shout for help brought their partners in the other boat, and soon both boats were filled with fish and on the verge of sinking.\n>\n> When Simon Peter realized what had happened, he fell to his knees before Jesus and said, \"Oh, Lord, please leave me — I'm such a sinful man.\" For he was awestruck by the number of fish they had caught, as were the others with him. His partners, James and John, the sons of Zebedee, were also amazed.\n>\n> Jesus replied to Simon, \"Don't be afraid! From now on you'll be fishing for people!\"\n\nPeter did not say: \"Jesus, that was amazing! Come fishing with us every day!\"\n\nHe recognized who Jesus was. And at the same moment, he saw who he was — a sinner.\n\nJust as Isaiah was, Peter was then given a mission by God.\n\n**The pattern is clear: we do not truly know ourselves until we see ourselves in the light of who God is.**\n\n---\n\n**Discussion Question:**\n\nWhat did Isaiah and Peter have in common when they encountered God's holiness?\n\n---\n\n## Part 2: The Problem of Self-Knowledge\n\nThere is a very old question: \"Who am I?\"\n\nThis question is harder to answer than it should be.\n\nStudies show that most people have a wrong view of themselves.\n\nMost people think they are better than they really are.\n\n---\n\nWe can measure our physical size easily.\n\nWe know we are smaller than an elephant and bigger than a fly.\n\nBut how do we measure ourselves morally? How do we know if we are good or bad?\n\nOn most days, most people feel fine about themselves.\n\nWe rarely remember the wrong things we did.\n\nBut we clearly remember the times when others were wrong to us.\n\nOur feelings give us a false picture of ourselves.\n\n---\n\nWe also compare ourselves to other people.\n\nBut other people are not a good standard.\n\n*Example: Think about what makes a stain ugly. A stain on a picnic table is not so bad. But the same stain on a famous painting would be terrible. The background makes the difference.*\n\nIn the same way, the background we use to judge ourselves changes everything.\n\nWe cannot use other people as our standard.\n\nHistory shows that whole nations can think they are good when they are not.\n\n**The only true standard is God's holiness.**\n\n---\n\n**Romans 1:18–21 (NLT)**\n\n> But God shows his anger from heaven against all sinful, wicked people who suppress the truth by their wickedness. They know the truth about God because he has made it obvious to them. For ever since the world was created, people have seen the earth and sky. Through everything God made, they can clearly see his invisible qualities — his eternal power and divine nature. So they have no excuse for not knowing God. Yes, they knew God, but they wouldn't worship him as God or even give him thanks. And they began to think up foolish ideas of what God was like. As a result, their minds became dark and confused.\n\n*Definitions:*\n\n| Word | Meaning |\n|---|---|\n| suppress¹ | to hide or stop something from being known |\n| divine nature² | the qualities that belong to God alone |\n| worship³ | to honor and praise God as the greatest |\n\nGod's word says that people choose to hide the truth about God.\n\nThey do not want to honor God.\n\nBecause of this, their thinking becomes confused. Their hearts become dark.\n\n---\n\n## Part 3: The Problem of Not Thinking\n\nWhy do many people feel no shame about being selfish or proud?\n\nIt is because they only look at themselves from inside themselves.\n\nIf you only look inward, you have no true standard to compare yourself to.\n\nYou cannot see yourself clearly.\n\nOur world makes this worse. We fill our lives with things to keep us busy.\n\nWe do not stop and think honestly about ourselves.\n\n---\n\n**Quote — Martin Lloyd-Jones, *Out of the Depths*:**\n\n> \"The first step to becoming a Christian is to stop and think. A person must think about himself. He must sit down and look at his own life. The world does everything it can to stop people from doing this. But the person who is a Christian has done it. He has stopped. He has looked. He has seen the truth about himself.\"\n\n*(Simplified from original)*\n\nIf we do not think, we are left only with our feelings.\n\nOur feelings almost never tell us the truth about ourselves.\n\nOur feelings tell us we are the victim. We are misunderstood. We are not appreciated.\n\nBut feelings are not the truth.\n\n---\n\n**Discussion Question:**\n\nWhen was the last time you thought honestly about what kind of person you really are?\n\n---\n\n## Part 4: A True Glimpse\n\nSometimes, even in everyday life, we get a small, true picture of our sin.\n\n*Example: You say something unkind about a friend in front of others. Then you see your friend's face. You see that she is hurt. In that moment, you understand clearly that what you did was wrong.*\n\n*Example: A father loves his daughter very much. You say something cruel near him without knowing he is there. You see his face — the pain and anger of a father who loves his child. Suddenly you understand how wrong your words were.*\n\nIn that moment, a true standard appears. The context shows you the truth.\n\n---\n\nNow think much bigger.\n\n**God is not just a loving father. God is the holy, loving Creator of all things.**\n\nHe sees every sin in its full ugliness.\n\nHe sees how our sins hurt other people.\n\nHe sees all the damage our sins cause across time.\n\nWe cannot see this fully. But God can.\n\nGod's holiness and God's love are not separate things. They are one.\n\nBecause God loves perfectly, he is also completely opposed to sin.\n\nThe only true background for seeing yourself is God's holy character.\n\nWhen we see ourselves against God's holiness, we understand Isaiah's cry:\n\n**\"Woe is me, I am ruined.\"**\n\n---\n\n**Discussion Questions:**\n\n1. What are some ways you avoid seeing yourself clearly?\n2. Describe a time when you saw your sin more clearly. What helped you see it?\n3. How has understanding God's holiness changed the way you see yourself?\n"
  },

    "content": "# SESSION 1C — THE CROSS\n**Course 201 · Chapter 1 · Holiness of God**\n\n---\n\n## Key Words\n\n| Word | Meaning |\n|---|---|\n| wrath | very strong, holy anger toward sin |\n| mercy | kindness given to someone who does not deserve it |\n| grace | God's free gift of love and forgiveness to sinners |\n| justice | giving the right punishment for wrong actions |\n| atonement | when the punishment for sin is fully paid |\n| sacrifice | something given up to pay a great cost; here: Jesus dying for our sin |\n| righteousness | being fully right and good before God |\n| eternity | time that never ends; life after death |\n\n---\n\n## Review\n\nBefore we begin, look back at the last two sessions.\n\n**1A — Seeing God:** God is holy. His holiness is the most important thing to know about him.\n\n**1B — Seeing Myself:** When we see God's holiness, we see our own sin clearly.\n\n---\n\n## Part 1: God's Wrath Toward Sin\n\nGod is holy. God loves what is pure and good.\n\nThis means God must be against sin.\n\nEvery day of our lives, we have sinned. Every sin is against God.\n\nSeeing this is the beginning of a Christian life. It must also continue throughout a Christian life.\n\nBut there is a problem. Deep in our hearts, we resist this truth.\n\nWe find it hard to accept that God is seriously angry at sin.\n\nWe find it hard to be truly amazed by his mercy.\n\n---\n\n**Quote — R.C. Sproul, *Holiness of God*:**\n\n> \"When God's justice falls, we are offended because we think God owes us mercy. We must not take his grace for granted. We must never lose our ability to be amazed by grace.\"\n\nR.C. Sproul then tells this story about his students:\n\n---\n\nHe taught 250 university students. He gave them three papers to write.\n\nHe clearly said: \"The first paper is due on the last day of September. No late papers. If you are late, you will receive a failing grade.\"\n\nOn the last day of September, 225 students gave in their papers on time.\n\n25 students did not. They were very sorry. They asked for more time.\n\nProfessor Sproul had mercy. He gave them more time.\n\nOn the last day of October, 200 students gave in their papers.\n\n50 students did not. They asked for more time again.\n\nProfessor Sproul had mercy again. But he warned them: \"This is the last time.\"\n\nOn the last day of November, 150 students gave in their papers.\n\n100 students did not — and they were not even worried.\n\nWhen Professor Sproul gave them all failing grades, the students were very angry.\n\nThey shouted: \"That's not fair!\"\n\nBut they had forgotten: they had already received mercy twice. They began to expect it. Then they demanded it.\n\n---\n\n**Quote — R.C. Sproul, *Holiness of God*:**\n\n> \"We have come to expect God to be merciful. From there the next step is easy: we demand it. We soon forget that with our first sin we gave up all rights to the gift of life. That I am breathing this morning is an act of God's mercy. God owes me nothing. I owe him everything.\"\n\n*Definitions:*\n\n| Word | Meaning |\n|---|---|\n| mercy¹ | kindness to someone who deserves punishment |\n| demand² | to say you must be given something |\n\n---\n\n**Discussion Question:**\n\nDo you ever feel that God owes you mercy? What does this story teach you?\n\n---\n\n## Part 2: God's Wrath and His Love\n\nGod is completely pure. Because he is pure, he is angry at sin.\n\nThis is not a problem with God. It is actually the right response to sin.\n\n*Example: Imagine you have a young child in your family — a niece or nephew — whom you love very much. Because you love that child, you are very angry at anything that could hurt them. Your love creates your anger against what is harmful.*\n\nIn the same way, God's love creates his anger against sin.\n\n**God's love and God's wrath are not opposites. They come from the same holy character.**\n\nGod sees everything our sin does.\n\nHe sees all the people hurt by our unkind words.\n\nHe sees all the damage caused by our selfishness, our envy, and our pride.\n\nHe sees the full result of our sin across all of time.\n\nWe cannot see all of this. But God can.\n\nThis is why God takes sin so seriously.\n\n---\n\n## Part 3: A Good God and Hell\n\nSome people ask: \"If God is good, how can he send people to hell?\"\n\nThis question has a simple answer.\n\nA good person naturally hates evil. The better a person is, the more they hate evil.\n\n**God is perfectly good. So God perfectly hates sin and its consequences.**\n\n---\n\nHonestly examine yourself:\n\n- Have you ever told a lie?\n- Have you ever cheated?\n- Have you ever felt glad when something bad happened to someone you disliked?\n- Have you ever used other people for your own gain?\n- Have you ever said cruel things?\n- Have you ever wished harm on someone?\n\nWhen we honestly answer these questions, the truth is uncomfortable.\n\nThe Bible says the same thing:\n\n---\n\n**Mark 7:20–23 (NLT)**\n\n> And then he added, \"It is what comes from inside that defiles you. For from within, out of a person's heart, come evil thoughts, sexual immorality, theft, murder, adultery, greed, wickedness, deceit, lustful desires, envy, slander, pride, and foolishness. All these vile things come from within; they are what defile you.\"\n\n*Definitions:*\n\n| Word | Meaning |\n|---|---|\n| defile³ | to make unclean or impure |\n| immorality⁴ | behavior that goes against what is right |\n| adultery⁵ | being unfaithful to your husband or wife |\n| greed⁶ | always wanting more than you need |\n| deceit⁷ | saying or doing things to trick people |\n| slander⁸ | saying false, harmful things about someone |\n\n---\n\n**2 Timothy 3:2–5 (NLT)**\n\n> For people will love only themselves and their money. They will be boastful and proud, scoffing at God, disobedient to their parents, and ungrateful. They will consider nothing sacred. They will be unloving and unforgiving; they will slander others and have no self-control. They will be cruel and hate what is good. They will betray their friends, be reckless, be puffed up with pride, and love pleasure rather than God. They will act religious, but they will reject the power that could make them godly.\n\n*Definitions:*\n\n| Word | Meaning |\n|---|---|\n| boastful⁹ | talking proudly about yourself |\n| sacred¹⁰ | set apart for God; holy |\n| betray¹¹ | to hurt someone who trusted you |\n\n---\n\nThe Bible confirms what we already know inside: we are sinners.\n\nSo the real question is not \"Why does God punish sin?\"\n\n**The real question is: \"Why does God allow us to keep living?\"**\n\nWe have no claim on God. God owes us nothing.\n\nYet God has been patient with us.\n\nHe has given us time to repent and come to him.\n\nBut we must not mistake his patience for approval.\n\n---\n\n**Quote — C.S. Lewis:**\n\n> \"There are two kinds of people: those who say to God, 'Your will be done,' and those to whom God will say, 'Your will be done.'\"\n\nHell is simply what happens when a person gets what they have always chosen: life without God.\n\n---\n\n**Three important truths together:**\n\n1. God is holy.\n2. We are sinners.\n3. Eternity is real.\n\nIf all three are true, there is only one conclusion: without Jesus, we all face eternity apart from God.\n\n**But — there is the cross of Jesus.**\n\n---\n\n## Part 4: The Cross\n\nThe cross of Jesus is the answer to everything in this session.\n\nGod is holy. We are sinners. We deserve his judgment.\n\nBut on the cross, Jesus took that judgment in our place.\n\nThe punishment we deserved fell on Jesus — the perfect, sinless Son of God.\n\n---\n\n**2 Corinthians 5:21 (NLT)**\n\n> For God made Christ, who never sinned, to be the offering for our sin, so that we could be made right with God through Christ.\n\n*Definitions:*\n\n| Word | Meaning |\n|---|---|\n| offering¹² | something given to God to pay for sin |\n| made right¹³ | forgiven and accepted fully by God |\n\n---\n\n**Isaiah 6:5–7 (NLT)**\n\n> Then I said, \"It's all over! I am doomed, for I am a sinful man. I have filthy lips, and I live among a people with filthy lips. Yet I have seen the King, the LORD of Heaven's Armies.\"\n>\n> Then one of the seraphim flew to me with a burning coal he had taken from the altar with a pair of tongs. He touched my lips with it and said, \"See, this coal has touched your lips. Now your guilt is removed, and your sins are forgiven.\"\n\nWhen Isaiah said \"Woe is me,\" God acted.\n\nThe angel came and said: \"Your guilt is taken away. Your sin is forgiven.\"\n\n**This is the pattern of the cross:**\n\nWhen we honestly admit we are sinners before a holy God — God acts.\n\nHe gives us the forgiveness we do not deserve.\n\nJesus took all of our sin upon himself. He paid the full price.\n\nIn return, we receive his righteousness.\n\nThis is the greatest news any person could ever hear.\n\n---\n\n## Part 5: Pitfalls — What Happens Without This Truth\n\nIf we do not truly understand God's holiness, several things go wrong:\n\n**1. We do not take sin seriously.**\nWe treat it as small or unimportant.\n\n**2. We do not work to grow and change.**\nWe lose the reason to fight against sin in our lives.\n\n**3. We lose the joy of being saved.**\nWe forget what we were saved from.\n\n**4. We become proud.**\nWe think we are good instead of being thankful that God is good.\n\n**5. We live for people's opinions instead of for God.**\nWe try to look good instead of truly loving God.\n\n---\n\n**Discussion Questions:**\n\n1. Do you take your sin seriously? What makes it hard?\n2. Which pitfall do you most recognize in yourself?\n3. Spend some time thanking God for the cross. What do you want to say to him?\n"

    "content": "# SESSION 1D — SELF-REFLECTION\n**Course 201 · Chapter 1 · Holiness of God**\n\n---\n\n## Key Words\n\n| Word | Meaning |\n|---|---|\n| self-reflection | thinking honestly and carefully about yourself |\n| discipline | doing something regularly and with purpose |\n| solitude | being alone and quiet on purpose |\n| rationalize | to make excuses for something wrong you did |\n| repentance | turning away from sin and back to God |\n| iniquity | serious wrong or sin |\n\n---\n\n## Introduction: Why Self-Reflection?\n\nIn this course, we have learned that God is holy.\n\nWe have also seen that when people encounter God's holiness, they see themselves clearly.\n\n**Self-reflection is a practice that helps us see ourselves honestly — against the background of God's holiness.**\n\nWithout it, we go through life with a wrong picture of ourselves.\n\n---\n\n**Quote — Dr. Martin Lloyd-Jones, *Out of the Depths*:**\n\n> \"A Christian is someone who has seen himself and seen what he has done. He has seen his sin. He knows he has sinned against God. He sees that his own nature is sinful.\"\n\n*(Simplified from original)*\n\n---\n\n**Quote — Henri Nouwen, *Making All Things New*:**\n\n> \"As soon as we are alone, inner chaos opens up in us. When we remove outside distractions, our inner problems appear with full force. We often use outside activities to protect ourselves from what is happening inside.\"\n\n*(Simplified from original)*\n\n*Definitions:*\n\n| Word | Meaning |\n|---|---|\n| chaos¹ | great confusion and disorder |\n| distraction² | something that stops you from thinking or focusing |\n\nBeing alone and quiet is not comfortable at first.\n\nOur fears, worries, and unresolved problems come to the surface.\n\nThis is why many people stay busy — to avoid facing themselves.\n\n**But this is exactly why self-reflection is so important.**\n\n---\n\n## What Is Self-Reflection?\n\nSelf-reflection is **written thinking**.\n\nYou write about something that happened — an event, a moment, a reaction.\n\nYou think carefully and honestly about what it reveals about you.\n\nWriting helps you be more honest. It slows down your thinking. It cuts through excuses.\n\n---\n\n## The 4 Steps of Self-Reflection\n\n---\n\n### Step 1 — List the Facts\n\nUse the 5 W's: **Who, What, When, Where, Why**\n\nWrite down what happened as clearly and honestly as you can.\n\nWrite only facts. Do not write feelings or excuses yet.\n\n*Example: Instead of writing \"I felt attacked, so I responded strongly,\" just write: \"I raised my voice at my friend.\"*\n\nFocusing on facts stops you from justifying what you did.\n\n---\n\n### Step 2 — Explore\n\nAfter writing the facts, ask yourself some questions:\n\n- Why did I say that?\n- Why did I do that?\n- What was I feeling at that moment?\n- What was going through my mind?\n- What happened before this incident?\n\nThis step helps you understand what was really going on inside you.\n\n---\n\n### Step 3 — What Does This Reveal About Me?\n\nThis is the most important step.\n\nAfter you have the facts and have explored your feelings, ask:\n\n**\"What does this show about who I am?\"**\n\nSome helpful questions:\n\n- What does this show about what drives me?\n- What does this show about what is inside my heart?\n- What does this show about how I see God, others, or myself?\n- What does this reveal about what matters most to me?\n\n**Important:** Use simple, plain words. Do not be overly dramatic.\n\n*Example: Do not write \"I feel I don't deserve the cross of Jesus!\" Instead write: \"I spoke unkindly because I wanted people to notice me.\"*\n\nThe goal is clear truth — not strong emotion.\n\n---\n\n### Step 4 — The Word of God\n\nThis step is what makes Christian self-reflection different from ordinary self-examination.\n\nAsk yourself:\n\n- What does the Bible say about this?\n- How does God's word correct me here?\n- What does the gospel say to me at this point?\n\nThis step is very important. Without it, two bad things can happen:\n\n**Problem 1:** You go into a spiral of shame. You just feel bad about yourself without finding God's forgiveness.\n\n**Problem 2:** You identify what you did wrong — and then stop. You do not bring it to God.\n\nBoth problems leave God out of the process.\n\n**The goal is not just to feel bad about sin. The goal is to bring your sin to God and receive his grace.**\n\n---\n\n**Isaiah 1:18 (NLT)**\n\n> \"Come now, let's settle this,\" says the LORD. \"Though your sins are like scarlet, I will make them as white as snow. Though they are red like crimson, I will make them as white as wool.\"\n\n*Definitions:*\n\n| Word | Meaning |\n|---|---|\n| scarlet³ | bright red — a picture of serious sin |\n| crimson⁴ | another word for deep red |\n\nGod does not ask us to fix ourselves first. He says: \"Come. Let us talk. Let me clean you.\"\n\nHe wants to be honest with us. He wants to forgive us and heal us.\n\n---\n\n**Quote — Martyn Lloyd-Jones, *Out of the Depths*:**\n\n> \"Have you faced yourself? Look back across your life. Look at the things you have thought, said, and done. This is the first step toward knowing God and experiencing his salvation. You have to fight for your soul. The world will do everything to prevent you from facing yourself.\"\n\n*(Simplified from original)*\n\n---\n\n## Why Self-Reflection Matters\n\nBy nature, we have many layers of self-deception.\n\nWe deny, rationalize, and justify our sin.\n\nWritten self-reflection helps cut through all of this.\n\nIt helps us find the truth about who we are.\n\nAnd with the truth, we can also find God's grace, forgiveness, and freedom.\n\n**There is real freedom when we have honestly faced ourselves, repented, and received God's forgiveness.**\n\n---\n\n**Quote — Martyn Lloyd-Jones, *Out of the Depths*:**\n\n> \"There is no hope for a person who does not face themselves. Look at yourself. It is the first step in knowing God and experiencing his glorious salvation.\"\n\n*(Simplified from original)*\n\n---\n\n## Self-Reflection Exercise\n\n**Spend 15 minutes doing the 4 steps on your own.**\n\nChoose one recent incident or pattern in your life.\n\nWork through all four steps in writing:\n\n1. **Facts** — What happened?\n2. **Explore** — What was I feeling and thinking?\n3. **What does this reveal?** — What does this show about my heart?\n4. **Word of God** — What does the Bible say? What does the gospel give me?\n\n---\n\n## Discussion Questions\n\n1. Is it easy or hard for you to think honestly about yourself? Why?\n2. Which of the 4 steps do you find most difficult? Why?\n3. What happens when you skip Step 4 (the Word of God)?\n4. Share what you discovered about yourself from the exercise.\n\n---\n\n*End of Session 1D — End of Chapter 1*\n\n---\n\n**Chapter 1 Summary:**\n\n- **1A — Seeing God:** God is holy. He is separate from and far above all things.\n- **1B — Seeing Myself:** When we see God's holiness, we see our sin clearly.\n- **1C — The Cross:** Jesus took the punishment for our sin. This is the greatest news.\n- **1D — Self-Reflection:** We practice seeing ourselves honestly through God's word.\n"

    "content": "# SESSION 2A — WE NEED REPENTANCE\n**Course 201 · Chapter 2 · Repentance**\n\n---\n\n## Key Words\n\n| Word | Meaning |\n|---|---|\n| repentance | turning away from sin and back to God |\n| fellowship | a close, open relationship with God or others |\n| confession | honestly admitting your sin to God |\n| position | your standing before God — forgiven and secure in Christ |\n| fellowship | your daily closeness and connection with God |\n\n---\n\n## Part 1: We Hide From God\n\nWhen we do something wrong, our first reaction is to hide.\n\nWe want to hide what we did. We want to hide from the truth. And we want to hide from God.\n\nThis started at the very beginning.\n\n**Genesis 3:8–10 (NLT)**\n\n> When the cool evening breezes were blowing, the man and his wife heard the LORD God walking about in the garden. So they hid from the LORD God among the trees. Then the LORD God called to the man, \"Where are you?\" He replied, \"I heard you walking in the garden, so I hid. I was afraid because I was naked.\"\n\nGod did not walk away from Adam. He called out to him.\n\nThis has always been God's response to us when we sin.\n\nHe calls: **\"Where are you? Let's talk.\"**\n\n**Isaiah 1:18 (NLT)**\n\n> \"Come now, let's settle this,\" says the LORD. \"Though your sins are like scarlet, I will make them as white as snow. Though they are red like crimson, I will make them as white as wool.\"\n\nFrom the beginning to the end of the Bible, God's invitation is the same: *Come. Let us talk.*\n\n---\n\n## Part 2: God's Goal Is Fellowship\n\nGod wants to be close to us. He wants to be our Father and we his children.\n\nHe wants nothing to break this relationship.\n\nBut when we sin and hide, we damage our closeness with him.\n\n**1 John 1:1–9 (NLT)**\n\n> We proclaim to you the one who existed from the beginning, whom we have heard and seen...\n>\n> This is the message we heard from Jesus and now declare to you: God is light, and there is no darkness in him at all. So we are lying if we say we have fellowship with God but go on living in spiritual darkness; we are not practicing the truth. But if we are living in the light, as God is in the light, then we have fellowship with each other, and the blood of Jesus, his Son, cleanses us from all sin.\n>\n> If we claim we have no sin, we are only fooling ourselves and not living in the truth. But if we confess our sins to him, he is faithful and just to forgive us our sins and to cleanse us from all wickedness.\n\n*Definitions:*\n\n| Word | Meaning |\n|---|---|\n| fellowship¹ | a close, open friendship |\n| cleanse² | to clean completely; to remove all sin |\n| confess³ | to honestly tell God what you did wrong |\n\n---\n\n**Mark 1:14–15 (NLT)**\n\n> Later on, after John was arrested, Jesus went into Galilee, where he preached God's Good News. \"The time promised by God has come at last!\" he announced. \"The Kingdom of God is near! Repent of your sins and believe the Good News!\"\n\nThe very first words of Jesus' teaching were: *\"Repent and believe.\"*\n\nRepentance is the path back to God. It is the way to stay close to him.\n\n---\n\n**Discussion Questions:**\n\n1. What words come to your mind when you think of repentance?\n2. What makes repentance difficult for you?\n\n---\n\n## Part 3: Repentance and Fellowship\n\nWhen we trust in Christ, our position before God is secure.\n\nGod has forgiven all our sins — past, present, and future.\n\nNothing can take away our standing as God's forgiven children.\n\n**But our sins can damage our daily closeness with God.**\n\nWhen we sin, we start to feel distant from God. We feel fear and doubt. Our affection for God becomes cold.\n\n---\n\n*Example: A father tells his ten-year-old son: \"Do not play baseball inside the house.\" But the son does. He breaks an expensive vase. He hides it. He tries to repair it. When his father comes home, the son avoids him. He is nervous. He does not enjoy being with his father like before.*\n\nThis is what happens to us when we sin and hide from God.\n\nWhat could the son do? He could:\n- Keep hiding the sin (growing more distant)\n- Try to make up for it by doing good things (missing the point)\n- Run away out of shame (also missing the point)\n- Confess to his father honestly\n\nThe right response is to confess. The father loves the son. When the son confesses, the father forgives him. They become even closer than before.\n\n**This is exactly what God wants from us.**\n\n---\n\n**Discussion Questions:**\n\n1. What happens when we hide our sin instead of confessing it to God?\n2. What wrong ideas about God make you afraid to repent?\n\n---\n\n## Session 2A Quiz\n\n**Fill in the blank:**\n\nAlthough our position is secure through Christ, our sins affect our \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ with God.\n\n---\n\n**Choose the best answer:**\n\nWhich best summarizes Session 2A? \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ is the path to \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ with God.\n\n- a) Repentance, fellowship\n- b) Fellowship, relationship\n- c) Confession, repentance\n- d) Good works, peace\n"

    "content": "# SESSION 2B — DREADFUL REPENTANCE\n**Course 201 · Chapter 2 · Repentance**\n\n---\n\n## Key Words\n\n| Word | Meaning |\n|---|---|\n| pride | thinking too highly of yourself; not wanting to admit you are wrong |\n| self-atonement | trying to pay for your own sin through your own effort |\n| worldly sorrow | feeling sorry for sin only because of its consequences to you |\n| godly sorrow | feeling sorry for sin because you hurt God and others |\n| repentance | turning away from sin back to God |\n| gospel | the good news that Jesus paid for our sin so we can be forgiven |\n\n---\n\n## Introduction\n\nMany Christians find repentance difficult or even frightening.\n\nWhy? There are three main reasons:\n\n1. **Pride**\n2. **Self-atonement** (trying to fix things yourself)\n3. **Not trusting in God's grace**\n\n---\n\n## Part 1: Pride\n\nWhen we sin, it hurts our pride to face it honestly.\n\nWe made a promise not to sin. We sinned again. We feel deep disappointment with ourselves.\n\nSo we avoid dealing with it. We pretend it did not happen.\n\nBut pride is harmful. It keeps us away from God. It keeps us away from the truth.\n\n**Discussion Question:** Can you relate to avoiding repentance because of pride?\n\n---\n\n## Part 2: Self-Atonement\n\nSelf-atonement means trying to pay for your own sin yourself.\n\nConsider two men who both failed Jesus. One is Judas. The other is Peter.\n\n**Matthew 27:3–5 (NLT)**\n\n> When Judas, who had betrayed him, realized that Jesus had been condemned to die, he was filled with remorse. So he took the thirty pieces of silver back to the leading priests and the elders. \"I have sinned,\" he declared, \"for I have betrayed an innocent man.\" ... Then Judas threw the silver coins down in the Temple and went out and hanged himself.\n\n**Luke 22:60–62 (NLT)**\n\n> But Peter said, \"Man, I don't know what you are talking about.\" And immediately, while he was still speaking, the rooster crowed. At that moment the Lord turned and looked at Peter. Suddenly, the words of the Lord flashed through Peter's mind: \"Before the rooster crows tomorrow morning, you will deny three times that you even know me.\" And Peter left the courtyard, weeping bitterly.\n\nJudas felt sorry for what he did. But his sorrow was about himself. He tried to fix it on his own.\n\nPeter also felt deep pain. But Peter's tears were toward Jesus. He was sorry because he had hurt the one he loved.\n\n---\n\n**Self-atonement has two serious problems:**\n\n**Problem 1: It leaves Jesus out.**\nWhen we sin, we sin against God. We should go to God for forgiveness. Self-atonement ignores God completely.\n\n**Problem 2: It does not work — and it insults Jesus.**\nWe cannot pay for our own sin. Jesus died on the cross to pay for our sin. If we try to pay for it ourselves, it is as if we are saying Jesus did not need to die.\n\n---\n\n**2 Corinthians 7:9–10 (NLT)**\n\n> Now I am glad I sent it, not because it hurt you, but because the pain caused you to repent and change your ways. It was the kind of sorrow God wants his people to have... For the kind of sorrow God wants us to experience leads us away from sin and results in salvation. There's no regret for that kind of sorrow. But worldly sorrow, which lacks repentance, results in spiritual death.\n\n*Definitions:*\n\n| Word | Meaning |\n|---|---|\n| repent⁴ | to turn away from sin and back to God |\n| sorrow⁵ | deep sadness and regret |\n| salvation⁶ | being saved from sin and its consequences |\n\n**Godly sorrow** is directed toward God. It says: \"I hurt God. I need his forgiveness.\"\n\n**Worldly sorrow** stays focused on yourself. It leads to more pain, not healing.\n\n---\n\n**Discussion Question:** Evaluate this story of repentance:\n\n*\"I was living in sin while teaching children at church. One day a student said she could not believe in God because all Christians she knew were hypocrites. She looked at me when she said it. I knew she was right. I stopped my sinful lifestyle. I have been faithfully teaching ever since. I hope God is pleased with me.\"*\n\nWhat is right about this person's repentance? What is missing?\n\n---\n\n## Part 3: Not Trusting in God's Grace\n\nA third reason people find repentance hard: they picture God as angry and hard to please.\n\nThey think they must show how sorry they are before God will forgive them.\n\nBut this misunderstands the gospel.\n\n---\n\n**Quote — Tim Keller, \"All of Life is Repentance\":**\n\n**Religious repentance is selfish.**\nIn religion, we are only sorry for sin because of its consequences to us. We want to avoid punishment.\n\nBut in the gospel, sin is wrong because it displeases and dishonors God. So gospel repentance is about God, not us.\n\n**Religious repentance is self-righteous.**\nIn religion, we try to make ourselves suffer enough to deserve forgiveness. But the gospel says Jesus already suffered for our sin. We simply receive his forgiveness as a gift.\n\n**Religious repentance is bitter.**\nIn religion, every sin is a crisis — because our only hope is our own goodness. But in the gospel, we know Jesus has accepted us. This makes it easier to admit we are wrong.\n\n*(Simplified from original)*\n\n---\n\n**Martin Luther said:**\n\n> \"The entire life of a believer is one of repentance.\"\n\nThis is not a sad statement. It means repentance is *how we grow* as Christians.\n\nThe more we understand God's grace, the more freely we repent.\n\nAnd the more we repent, the more amazing God's grace becomes to us.\n\n---\n\n**Discussion Questions:**\n\n1. Which of the three reasons for avoiding repentance (pride, self-atonement, not trusting grace) do you most relate to?\n2. What wrong ideas about God make repentance feel dreadful to you?\n\n---\n\n## Session 2B Quiz\n\n**Which is NOT true about \"worldly sorrow\"?**\n- a) It leads to death\n- b) It is directed toward God\n- c) It recognizes a wrong was done\n- d) It is discouraging\n\n**Which is NOT true about \"self-atonement\"?**\n- a) It does not work\n- b) It insults Jesus\n- c) It underestimates the seriousness of sin\n- d) It underestimates our ability to make up for sin\n\n**Which describes \"religious\" repentance? (Choose all that apply)**\n- a) We are sorry only because of the consequences of sin\n- b) We are sorry for the sin itself\n- c) It is God-centered\n- d) It is a way to earn forgiveness\n- e) We repent less and less over time\n"

    "id": "C201_2C_We_Dont_Understand_Repentance",
    "filename": "C201_2C_We_Dont_Understand_Repentance.md",
    "chapter": "Chapter 2",
    "title": "SESSION 2C — WE DON'T UNDERSTAND REPENTANCE",
    "subtitle": "Course 201 · Chapter 2 · Repentance",
    "content": "# SESSION 2C — WE DON'T UNDERSTAND REPENTANCE\n**Course 201 · Chapter 2 · Repentance**\n\n---\n\n## Key Words\n\n| Word | Meaning |\n|---|---|\n| misconception | a wrong idea or belief about something |\n| refreshing | a feeling of new life and joy; being made new |\n| ego | your sense of pride and self-importance |\n| humility | knowing you are not above others; accepting your weakness |\n| contrition | deep, genuine sorrow for sin |\n| intercession | praying on behalf of others |\n\n---\n\n## Introduction\n\nMany Christians have wrong ideas about repentance.\n\nThese wrong ideas stop them from repenting freely.\n\nIn this session, we will correct four common misconceptions.\n\n---\n\n## Misconception 1: Repentance Is Gloomy\n\nSome people think repentance is always a sad, dark experience.\n\nRepentance is serious. It involves sorrow. But the Bible promises something surprising:\n\n**Repentance brings times of refreshing.**\n\n**Acts 3:19–20 (NLT)**\n\n> Now repent of your sins and turn to God, so that your sins may be wiped away. Then times of refreshing will come from the presence of the Lord...\n\n*Definitions:*\n\n| Word | Meaning |\n|---|---|\n| repent¹ | to turn away from sin and back to God |\n| wiped away² | completely removed; gone forever |\n\nWhen we repent, we are restored to close fellowship with God.\n\nThis brings real joy.\n\nYes, repentance hurts our pride. But pride is harmful to us. When pride dies, something better grows in us — a child-like freedom and peace with God.\n\n---\n\n**Discussion Question:** Have you ever said sorry to someone and felt a sense of refreshing in that relationship afterward? Have you experienced this with God?\n\n---\n\n## Misconception 2: Repentance Is Purely Negative\n\nSome people think repentance is only about feeling bad.\n\nBut repentance is actually an invitation to freedom.\n\n**Quote — Jerry Bridges, *Discipline of Grace*:**\n\n> \"The gospel, applied to our hearts every day, frees us to be completely honest with ourselves and with God. The assurance of total forgiveness through Christ means we don't have to hide from our sins anymore. We can call sin exactly what it is — because we know Jesus carried that sin on the cross.\"\n\n*(Simplified from original)*\n\nWhen we repent, we realize the cross of Jesus reaches deeper than we thought.\n\nWe understand more of God's grace. Our love for him grows.\n\n---\n\n## Misconception 3: Repentance Should Be Done Rarely\n\nSome people think repentance is costly, so it should be saved for big moments.\n\nBut Jesus taught the opposite. He showed this in a beautiful way.\n\n**John 13:4–8 (NLT)**\n\n> So he got up from the table, took off his robe, wrapped a towel around his waist, and poured water into a basin. Then he began to wash the disciples' feet, drying them with the towel he had around him.\n>\n> When Jesus came to Simon Peter, Peter said to him, \"Lord, are you going to wash my feet?\"\n>\n> Jesus replied, \"You don't understand now what I am doing, but someday you will.\"\n>\n> \"No,\" Peter protested, \"you will never ever wash my feet!\"\n>\n> Jesus replied, \"Unless I wash you, you won't belong to me.\"\n\n*Definitions:*\n\n| Word | Meaning |\n|---|---|\n| protested³ | strongly said \"no\"; refused |\n\nWashing feet was the job of the lowest servant. In that time, feet were very dirty from walking on dusty roads.\n\nJesus used this picture to teach us something important.\n\nJesus wants to wash the dirtiest parts of us. That is why he came.\n\nWhen we refuse to bring our worst, most shameful self to Jesus, we push him away.\n\n**Do not be shy to come to Jesus with your sin — daily.**\n\n---\n\n## Misconception 4: Repentance Should Lead to Instant Change\n\nSome people think: \"If I truly repented, I would not do that sin again.\"\n\nBut this is not how repentance works.\n\nThe word for repentance in Greek is *metanoia*. It means \"change of mind.\"\n\nTrue repentance does change your mind about sin. You hate the sin. You love God who forgives you.\n\nBut change in behavior may take time — sometimes a long time.\n\n*Example: You have a bad temper. You hurt someone, repent, and promise not to do it again. But then you lose your temper again. This is discouraging. But inner change is happening. Repentance is leading you to humility and dependence on God.*\n\n---\n\n**Quote — Roy Hession, *Calvary Road*:**\n\n> \"To be broken is the beginning of revival. It is painful, it is humbling, but it is the only way.\"\n\n*(Simplified)*\n\n**Isaiah 57:15 (NLT)**\n\n> The high and lofty one who lives in eternity, the Holy One, says this: \"I live in the high and holy place with those whose spirits are contrite and humble. I restore the crushed spirit of the humble and revive the courage of those with repentant hearts.\"\n\n**Psalm 51:17 (NLT)**\n\n> The sacrifice you desire is a broken spirit. You will not reject a broken and repentant heart, O God.\n\n*Definitions:*\n\n| Word | Meaning |\n|---|---|\n| lofty⁴ | very high |\n| contrite⁵ | deeply sorry for wrong; broken before God |\n| humble⁶ | not proud; knowing your weakness before God |\n\n---\n\n**Pause and pray:** Is God speaking to you about a sin right now? Confess it to him. Then thank him for the gift of repentance through the cross of Jesus.\n\n---\n\n## Part 5: Repent AND Believe\n\n**Mark 1:14–15 (NLT)**\n\n> Later on, after John was arrested, Jesus went into Galilee, where he preached God's Good News. \"The time promised by God has come at last!\" he announced. \"The Kingdom of God is near! Repent of your sins and believe the Good News!\"\n\nNotice Jesus said *repent AND believe*. Not just repent.\n\nEvery sin has a deeper sin beneath it — a failure to believe the gospel.\n\n*Example: You react with anger when someone criticizes your work. On the surface, the sin is anger. But the deeper sin is: you have been finding your worth in your work, not in God. The gospel says you are loved and accepted by God because of Jesus — not because of your work. When you repent, you must also return to trusting that truth.*\n\n**Repentance is not just stopping a sin. It is returning to the gospel with fresh faith.**\n\n---\n\n## Pitfalls of Not Understanding Repentance\n\nIf we do not understand repentance properly, we will experience:\n\n- **Defensiveness** — We cannot hear truth about ourselves\n- **Avoidance of truth** — We hide from honest self-examination\n- **Distance from God and others** — Fellowship weakens\n- **No joy or life** — We miss the refreshing that repentance brings\n- **Viewing God as impossible to please** — We live in fear\n- **Hypocrisy** — We say one thing and live another\n\n---\n\n**Discussion Questions:**\n\n1. Which misconception about repentance have you believed?\n2. Have you experienced \"times of refreshing\" after repentance?\n3. What does it mean to repent AND believe the gospel?\n"
  },

    "content": "# SESSION 2D — CONFESSION AND REPENTANCE LOOP\n**Course 201 · Chapter 2 · Repentance**\n\n---\n\n## Key Words\n\n| Word | Meaning |\n|---|---|\n| confession | honestly naming your sin before God |\n| intercession | praying for other people |\n| catharsis | releasing strong emotions; feeling better after expressing feelings |\n| repentance loop | a step-by-step process for bringing sin to God and receiving his grace |\n| observe | to look carefully at something; to notice |\n| commit | to make a firm decision and promise |\n\n---\n\n## Introduction: Why Confession Matters\n\n**Quote — Henri Nouwen, *The Only Necessary Thing*:**\n\n> \"Evil loses its power when we confess that we have been in its control.\"\n\n*(Simplified from original)*\n\n**Quote — Richard Foster, *Celebration of Discipline*:**\n\n> \"Without the cross, confession would only help us feel better emotionally. But it does so much more. It changes our relationship with God objectively. It heals and transforms us from the inside.\"\n\n*(Simplified from original)*\n\n---\n\n**An important warning:**\n\nA general confession (\"I'm sorry for all my sins\") may help us avoid shame. But it will not bring deep healing.\n\n**Confession should be specific.**\n\nName the actual sin — pride, anger, fear, selfishness. Be honest and concrete.\n\n**Quote — Richard Foster, *Celebration of Discipline*:**\n\n> \"It is easy to avoid real guilt in a general confession. We need to confess specific sins — sins of the heart like pride, greed, and anger — as well as sins in our actions.\"\n\n*(Simplified from original)*\n\n---\n\n**Another important warning:**\n\nThere must be an *end point* to confession.\n\nConfession begins with sorrow — but it ends with **joy**.\n\nGod forgives us. There is celebration. We must not stay forever in self-criticism.\n\n---\n\n**Quote — J.D. Greear, *Stop Asking Jesus Into Your Heart*:**\n\n> \"Telling a friend or pastor about your sin and hearing them say 'it's OK' may feel good. But their words cannot restore your relationship with God. Only Jesus can do that. Our tears do not wash away sin. Only Jesus' blood does.\"\n\n*(Simplified from original)*\n\n---\n\n## The Repentance Loop\n\nThis is a practical tool for bringing your sin to God.\n\nBased on 2 Timothy 3:16–17 — all Scripture teaches us, corrects us, and trains us to live rightly.\n\n**X = an event, a reaction, a choice, or a temptation that you need to stop and consider.**\n\n---\n\n### Step 1 — Observe and Reflect\n\n**Stop. Look carefully at what happened.**\n\nAsk yourself:\n- What exactly happened?\n- What was I feeling?\n- Why did I react that way?\n- What was going through my mind?\n\nWe must see our sin clearly. We cannot repent of what we refuse to see.\n\n---\n\n### Step 2 — Word of God\n\n**Bring the situation to the Bible.**\n\nAsk:\n- What does the gospel say to me here?\n- What is true according to God's word?\n- How does the Bible correct me in this situation?\n\nThis is the step that separates Christian repentance from simply feeling bad.\n\nWithout God's word, you leave God out of the process.\n\n---\n\n### Step 3 — Confess and Apologize\n\n**Be specific. Avoid vague language.**\n\nName the sin clearly: \"I was proud.\" \"I was afraid and did not trust God.\" \"I was selfish.\"\n\nThen apologize — to God, and to any person you have hurt.\n\nExpress your trust in God's forgiveness through the cross of Jesus.\n\n---\n\n### Step 4 — Commit\n\n**Repentance means \"turning around.\"**\n\nExpress your new direction in words:\n- What do you now believe?\n- What do you commit to do differently?\n- How does the gospel speak to this area of your life?\n\nIf you stop at confession without committing, the sin will likely return.\n\n---\n\n### Step 5 — Plan of Action\n\n**Make a specific plan.**\n\nAsk:\n- What concrete steps will I take?\n- Who can help me with this?\n- Who should I bring into this for accountability?\n\n---\n\n## Apply It\n\nThink about the past week.\n\nChoose one incident or area where the Holy Spirit is showing you sin.\n\nWrite out your repentance using the 5 steps above.\n\nBe honest. Be specific. End with the gospel — what God says is true about you because of Jesus.\n\n---\n\n**Chapter 2 Summary:**\n\n- **2A — We Need Repentance:** Repentance is the path to fellowship with God.\n- **2B — Dreadful Repentance:** Pride, self-atonement, and not trusting grace make repentance hard.\n- **2C — We Don't Understand Repentance:** Repentance is not gloomy, negative, or rare. It brings refreshing.\n- **2D — Repentance Loop:** Use the 5-step loop to bring specific sin to God regularly.\n"

    "subtitle": "Course 201 · Chapter 3 · Heaven and Hell",
    "content": "# SESSION 3A — WHAT IS REAL?\n**Course 201 · Chapter 3 · Heaven and Hell**\n\n---\n\n## Key Words\n\n| Word | Meaning |\n|---|---|\n| eternity | time that never ends; life after death |\n| judgment | God's final decision about each person's life |\n| reality | what is truly real and important |\n| soul | the part of you that lives forever |\n| eternal life | life with God that never ends |\n| Alpha and Omega | the first and last letters of the Greek alphabet; a name for God meaning he is the beginning and the end |\n\n---\n\n## Part 1: We Are Blind to What Is Real\n\nThink about a teenager in high school.\n\nWhat makes them excited or worried?\n\nUsually: who likes them, what their friends think, how popular they are.\n\nThese things feel very real and very important.\n\nBut an older person knows: in five years, none of this will matter.\n\nThe teenager cannot see this yet.\n\n**We have the same problem — but with eternal things.**\n\nWhen something is far away, we act as if it is not real.\n\nWe know that death will come. We know that judgment is certain. We know eternity is real.\n\nBut these truths feel distant. So we live as if they do not matter today.\n\nThis is a serious problem.\n\n---\n\n## Part 2: What Jesus Said\n\nJesus warned us about this problem directly.\n\n**Luke 17:26–30 (NLT)**\n\n> When the Son of Man returns, it will be like it was in Noah's day. In those days, the people enjoyed banquets and parties and weddings right up to the time Noah entered his boat and the flood came and destroyed them all. And the world will be as it was in the days of Lot. People went about their daily business — eating and drinking, buying and selling, farming and building — until the morning Lot left Sodom. Then fire and burning sulfur rained down from heaven and destroyed them all. Yes, it will be 'business as usual' right up to the day when the Son of Man is revealed.\n\nThe people of Noah's time were not doing evil things. They were eating, drinking, getting married.\n\nBut they were completely blind to what was about to happen.\n\n**This is the danger: being fully occupied with everyday life while ignoring what matters most.**\n\n---\n\n**Luke 14:16–20 (NLT)**\n\n> Jesus replied with this story: \"A man prepared a great feast and sent out many invitations. When the banquet was ready, he sent his servant to tell the guests, 'Come, the banquet is ready!' But they all began making excuses. One said, 'I just bought a field and must inspect it. Please excuse me.' Another said, 'I just bought five pairs of oxen, and I want to try them out. Please excuse me.' Another said, 'I just got married, so I can't come.'\"\n\nThe excuses were not evil things. They were ordinary, everyday matters.\n\nBut these ordinary things took priority over the most important invitation.\n\n*Definitions:*\n\n| Word | Meaning |\n|---|---|\n| banquet¹ | a large, special meal; a feast |\n| inspection² | looking carefully at something |\n\n---\n\n**Discussion Questions:**\n\n1. What activities were the people of Noah's time doing? What do these activities have in common?\n2. Why did the people in Jesus' story refuse the invitation? What does this tell you?\n\n---\n\n## Part 3: The Beginning and the End\n\n**John 3:16 (NLT)**\n\n> For this is how God loved the world: He gave his one and only Son, so that everyone who believes in him will not perish but have eternal life.\n\nThese are the real realities: God's love, his Son, belief, perishing, eternal life.\n\nWe must learn to see life through this lens.\n\n**Revelation 22:12–13 (NLT)**\n\n> \"Look, I am coming soon, bringing my reward with me to repay all people according to their deeds. I am the Alpha and the Omega, the First and the Last, the Beginning and the End.\"\n\nGod is the beginning and the end of all things.\n\nOur past is God — he knew us before we were born.\n\nOur future is God — he is the final judge of all.\n\n*Example: Most of us think carefully about money, work, and health. We plan for next year. But how much do we think about where we will be in 100 years? In 1,000 years? God is asking us to live with that in view.*\n\n---\n\n**Discussion Question:** Are you living with your end in mind? What would change if you did?\n\n---\n\n## Part 4: Our Default Mindset\n\nOur usual mindset is this: live for what I can see, feel, and touch right now.\n\nThoughts about death and eternal judgment feel distant and uncomfortable. So we push them away.\n\nThe Bible says this is not a neutral position. It is a form of pride.\n\n**Quote — Blaise Pascal, *Pensées*:**\n\n> \"People fear small things, but the same person who worries deeply about small problems feels no fear about the fact that he is going to lose everything at death. It is a strange thing to be so sensitive about small matters and so unmoved by the greatest one of all.\"\n\n*(Simplified from original)*\n\n*Definitions:*\n\n| Word | Meaning |\n|---|---|\n| sensitive³ | easily affected by; quick to respond to |\n\n---\n\n## Part 5: The Rich Fool\n\n**Luke 12:16–21 (NLT)**\n\n> Then he told them a story: \"A rich man had a fertile farm that produced fine crops. He said to himself, 'What should I do? I don't have room for all my crops.' Then he said, 'I know! I'll tear down my barns and build bigger ones. Then I'll have room enough to store all my wheat and other goods. And I'll sit back and say to myself, \"My friend, you have enough stored away for years to come. Now take it easy! Eat, drink, and be merry!\"'\n>\n> \"But God said to him, 'You fool! You will die this very night. Then who will get everything you worked for?'\n>\n> \"Yes, a person is a fool to store up earthly wealth but not have a rich relationship with God.\"\n\nThis man was smart and capable. He planned well for his future.\n\nBut his picture of reality was too small.\n\nHe was focused on his barns and his belly. He had no thought for his soul, for eternity, or for God.\n\nWhen he died, he was completely unprepared.\n\n**The question for us: Are we rich toward God — or only rich toward ourselves?**\n\n---\n\n**Discussion Questions:**\n\n1. What does the rich fool teach us about what we are paying attention to?\n2. How much of your thinking today is focused on things that will not matter in 100 years?\n3. What would it look like to be \"rich toward God\" in your life right now?\n"
  },

    "content": "# SESSION 3B — REALITY OF HEAVEN AND HELL\n**Course 201 · Chapter 3 · Heaven and Hell**\n\n---\n\n## Key Words\n\n| Word | Meaning |\n|---|---|\n| eternal | lasting forever; with no end |\n| judgment | God's final decision about each person's eternal life |\n| paradise | a place of perfect joy and peace with God |\n| denial | refusing to face the truth; pretending something is not real |\n| soul | the part of you that lives forever |\n| longing | a deep, strong desire for something |\n\n---\n\n## Part 1: What the Bible Says About Hell\n\nThe Bible is very clear: every person will die and then face judgment.\n\nThese verses show what God's word says about eternity:\n\n**Hebrews 9:27 (NLT)**\n\n> Each person is destined to die once and after that comes judgment.\n\n**2 Thessalonians 1:9 (NLT)**\n\n> They will be punished with eternal destruction, forever separated from the Lord and from his glorious power.\n\n**Matthew 25:41 (NLT)**\n\n> Then the King will turn to those on the left and say, \"Away with you, you cursed ones, into the eternal fire prepared for the devil and his demons.\"\n\n**John 5:24 (NLT)**\n\n> I tell you the truth, those who listen to my message and believe in God who sent me have eternal life. They will never be condemned for their sins, but they have already passed from death into life.\n\n*Definitions:*\n\n| Word | Meaning |\n|---|---|\n| destined¹ | certain to happen |\n| condemned² | declared guilty; punished |\n| eternal³ | lasting forever |\n\nHell is the final separation from God. It is being completely removed from the only source of goodness and light in the universe.\n\n**Sin is separation from God.** Hell is that separation continuing forever — without repair.\n\n---\n\n**Discussion Question:** What ideas about judgment and the afterlife did you have before you became a Christian? Where did those ideas come from?\n\n---\n\n## Part 2: The Testimony of Jesus\n\nJesus spoke about heaven and hell more than almost any other topic.\n\nHe taught about it in many stories and teachings — the sheep and the goats, the rich man and Lazarus, the Great Banquet, and more.\n\nAs Jesus was dying on the cross, he illustrated the truth of heaven one final time.\n\n**Luke 23:39–43 (NLT)**\n\n> One of the criminals hanging beside him scoffed, \"So you're the Messiah, are you? Prove it by saving yourself — and us, too, while you're at it!\"\n>\n> But the other criminal protested, \"Don't you fear God even when you have been sentenced to die? We deserve to die for our crimes, but this man hasn't done anything wrong.\" Then he said, \"Jesus, remember me when you come into your Kingdom.\"\n>\n> And Jesus replied, \"I assure you, today you will be with me in paradise.\"\n\n*Definitions:*\n\n| Word | Meaning |\n|---|---|\n| scoffed⁴ | made fun of; spoke with disrespect |\n| sentenced⁵ | given a punishment by a judge |\n| paradise⁶ | heaven; a place of joy and peace with God |\n\nThis criminal had no time to do good works. He simply believed. And Jesus said: \"Today you will be with me.\"\n\n**This is why Jesus died and rose again — to make a way for us to be with him forever.**\n\n**John 14:2–3 (NLT)**\n\n> There is more than enough room in my Father's home. If this were not so, would I have told you that I am going to prepare a place for you? When everything is ready, I will come and get you, so that you will always be with me where I am.\n\n---\n\n**Discussion Question:** How would you summarize Jesus' message about life after death?\n\n---\n\n## Part 3: Denial\n\nMany people choose not to think about death and eternity.\n\nThey tell themselves: \"It will probably be OK.\"\n\nBut what is that hope based on? Nothing real.\n\nPeople say: \"There probably is no hell. And if there is, I will probably get into heaven... somehow.\"\n\nThis is simply refusing to face reality.\n\n**Quote — Blaise Pascal, *Pensées*:**\n\n> \"Because people cannot cure death, sorrow, and ignorance, they have decided — in order to be happy — not to think about these things.\"\n\n*(Simplified from original)*\n\n---\n\n**Discussion Question:** What is your response to the fact that people can be happy simply by choosing not to think about death?\n\n---\n\n## Part 4: Longing for Heaven\n\nDeep inside every person, there is a longing for something more.\n\nEcclesiastes 3:11 says: \"God has planted eternity in the human heart.\"\n\nWe feel this longing in different ways — through music, beauty, nature, or a moment of deep joy.\n\nThese things give us a small taste of something we cannot fully explain.\n\n**Quote — C.S. Lewis, *Mere Christianity*:**\n\n> \"If I find in myself a desire which no experience in this world can satisfy, the most likely explanation is that I was made for another world.\"\n\n*(Simplified from original)*\n\n*Example: You hear a beautiful piece of music and feel a deep longing. But the music itself is not what you are longing for — something came through the music. C.S. Lewis calls this \"the inconsolable longing\" — a desire for heaven that nothing on earth can fully satisfy.*\n\nThe Bible describes us as people who are not fully at home in this world.\n\nWe were made for more. We were made for God. We were made for heaven.\n\n---\n\n**Discussion Questions:**\n\n1. Have you felt a desire that nothing in this world fully satisfies? When do you feel it most?\n2. How does it change your life to know you were made for eternity?\n\n---\n\n## Session 3B Quiz\n\n**Fill in the blank with one word:**\n\nC.S. Lewis says: \"Creatures are not born with \\_\\_\\_\\_\\_\\_\\_\\_ unless satisfaction for those \\_\\_\\_\\_\\_\\_\\_\\_ exists. If I find in myself a \\_\\_\\_\\_\\_\\_\\_\\_ which no experience in this world can satisfy, the most likely explanation is that I was made for another world.\"\n"

    "id": "C201_3C_Heaven_and_Hell",
    "filename": "C201_3C_Heaven_and_Hell.md",
    "chapter": "Chapter 3",
    "title": "SESSION 3C — HEAVEN AND HELL",
    "subtitle": "Course 201 · Chapter 3 · Heaven and Hell",
    "content": "# SESSION 3C — HEAVEN AND HELL\n**Course 201 · Chapter 3 · Heaven and Hell**\n\n---\n\n## Key Words\n\n| Word | Meaning |\n|---|---|\n| relational | having to do with relationships; connected to love and connection |\n| triune | three-in-one; describing God as Father, Son, and Holy Spirit |\n| rebellion | refusing to submit to authority; choosing to go your own way |\n| trajectory | the direction your life is going |\n| contrite | deeply sorry; broken before God |\n| eternity | time that never ends |\n\n---\n\n## Part 1: Heaven — Our True Home\n\nEvery person has a deep need for love.\n\nWithout love, life is very hard.\n\nAnd love, by its nature, wants to last forever. We never want love to end.\n\nThe Bible tells us this is by design. God himself is love — Father, Son, and Holy Spirit in eternal relationship.\n\nBecause God is love, our deep need for love is met by who God is.\n\n**Heaven is about relationship.** It is joining the eternal fellowship of God.\n\n**John 14:2–3 (NLT)**\n\n> There is more than enough room in my Father's home. If this were not so, would I have told you that I am going to prepare a place for you? When everything is ready, I will come and get you, so that you will always be with me where I am.\n\nSalvation is a restored relationship with God — one that continues forever.\n\nIf God loves us and saves us, then heaven must exist for that relationship to go on.\n\n---\n\n**Discussion Question:** How does this picture of heaven match what you understood about your own salvation?\n\n---\n\n## Part 2: Hell — A Relational Reality\n\nWe must also understand hell in a relational way.\n\nHell is not simply a punishment for breaking rules.\n\n**Hell is the final result of a person's own choice to remain separate from God.**\n\nIf someone has spent their whole life refusing God, refusing to submit to him, refusing his love — then God honors that choice forever.\n\n**Quote — C.S. Lewis, *The Problem of Pain*:**\n\n> \"Some will not be saved. If happiness requires a person to give themselves to God, no one can force them to do that. They must choose. If they will not give in, there is nothing more that can be done.\"\n\n*(Simplified from original)*\n\n**Quote — C.S. Lewis, *The Problem of Pain*:**\n\n> \"I believe that the doors of hell are locked on the inside.\"\n\n*(Simplified from original — this means those in hell have gotten what they chose: life without God)*\n\n*Definitions:*\n\n| Word | Meaning |\n|---|---|\n| surrender¹ | to give up; to stop fighting and submit |\n\nLove does not force itself on anyone.\n\nA person who has spent their whole life saying \"I do not need God\" will not suddenly want to be with him forever.\n\n**Hell is God respecting that person's final decision.**\n\n---\n\n**Discussion Question:** What is your response to C.S. Lewis's description of who goes to hell?\n\n---\n\n## Part 3: God's Heart — He Does Not Want Anyone to Be Lost\n\n**Ezekiel 33:11 (NLT)**\n\n> \"As surely as I live, says the Sovereign LORD, I take no pleasure in the death of wicked people. I only want them to turn from their wicked ways so they can live. Turn! Turn from your wickedness, O people of Israel! Why should you die?\"\n\n**1 Timothy 2:3–4 (NLT)**\n\n> This is good and pleases God our Savior, who wants everyone to be saved and to understand the truth.\n\n**2 Peter 3:9 (NLT)**\n\n> The Lord isn't really being slow about his promise, as some people think. No, he is being patient for your sake. He does not want anyone to be destroyed, but wants everyone to repent.\n\nGod does not send people to hell with pleasure.\n\nHis heart is to save everyone who will come to him.\n\nHe is patient. He calls. He waits.\n\n**Discussion Question:** What do these verses reveal about God's heart toward people who are lost?\n\n---\n\n## Part 4: Trajectory of Life\n\nThink about two people who grew up together.\n\nOne becomes a Christian. The other does not.\n\nIn daily life, they may not look very different.\n\nBut the direction of their lives is slowly, quietly diverging.\n\nOne is learning to worship, to pray, to repent, to see God in their life.\n\nThe other is not.\n\nThe difference may be small now. But extended over eternity, the difference is infinite.\n\n**Quote — C.S. Lewis, *The Weight of Glory*:**\n\n> \"It is a serious thing to live in a society of possible gods and goddesses... There are no ordinary people. You have never talked to a mere mortal. Nations, cultures, arts, civilization — these are mortal. But it is immortals whom we joke with, work with, marry, snub, and exploit.\"\n\n*(Simplified from original)*\n\n*Definitions:*\n\n| Word | Meaning |\n|---|---|\n| immortals² | beings who will live forever |\n| snub³ | to treat someone as unimportant |\n\nEvery person around you will live forever — either with God or without him. This changes how we see people.\n\n---\n\n**Discussion Questions:**\n\n1. What is the direction your life is going? Is it moving toward God or away from him?\n2. What new values or habits have grown in you since becoming a Christian?\n\n---\n\n## Part 5: What Makes God Real to Us?\n\nWhy do some people find it hard to sense God?\n\n**Isaiah 57:15 (NLT)**\n\n> The high and lofty one who lives in eternity, the Holy One, says this: \"I live in the high and holy place with those whose spirits are contrite and humble. I restore the crushed spirit of the humble and revive the courage of those with repentant hearts.\"\n\nGod is close to those who are humble and contrite.\n\nPride, self-absorption, and love of material things make it hard to sense God.\n\nWhen we come to God with humility — like the criminal on the cross — God becomes more real to us.\n\n*Example: To see stars clearly at night, you must turn off nearby lights. In the same way, to see God clearly, we must turn down the noise of self — our pride, our distractions, our self-reliance.*\n\n---\n\n**Discussion Questions:**\n\n1. What are some ways you can grow in being humble and contrite before God?\n2. How does your life measure up to this truth: \"Life is short, eternity is long, only what is done for God will last\"?\n"
  },
